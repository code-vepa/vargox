<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In / Sign Up — Vargox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-link">&larr; Back to all stocks</a>
    </header>

    <main>
        <div class="auth-card">
            <div class="auth-tabs">
                <button id="tab-signin" class="tab-btn active">Sign In</button>
                <button id="tab-signup" class="tab-btn">Sign Up</button>
            </div>

            <form id="signin-form">
                <input type="text" id="signin-username" placeholder="Username" required>
                <input type="password" id="signin-password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>

            <form id="signup-form" style="display: none;">
                <input type="text" id="signup-username" placeholder="Username" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>

            <div id="auth-error" class="error" style="display: none;"></div>
            <div id="auth-success" class="success" style="display: none;"></div>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
